<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellar Seat Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");
      body {
        font-family: "Outfit", sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900"
  >

<!-- Form-->
  <div id="authContainer" class="hidden fixed inset-0 flex items-center justify-center z-50 pointer-events-none">
  <div class="pointer-events-auto max-w-md w-full p-8 bg-white shadow-2xl rounded-2xl border border-gray-200">

    <!-- Toggle -->
    <div class="flex justify-center mb-6 gap-6">
      <button onclick="showLogin()" id="loginTab"
        class="px-4 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition">
        Login
      </button>
      <button onclick="showSignup()" id="signupTab"
        class="px-4 py-2 font-semibold text-gray-500 hover:text-indigo-600 transition">
        Sign Up
      </button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm text-gray-600 mb-1">Email</label>
        <input type="email" name="email" required
          class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-blue-500"/>
      </div>

      <div>
        <label class="block text-sm text-gray-600 mb-1">Password</label>
        <input type="password" name="password" required
          class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-blue-500"/>
      </div>

      <button type="submit"
        class="w-full py-2 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition">
        Login
      </button>
      <p id="loginError" class="text-red-500 text-sm hidden"></p>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signupForm" class="space-y-5 hidden">
      <div>
        <label class="block text-sm text-gray-600 mb-1">Name</label>
        <input type="text" name="name" required
          class="text-blue-500 w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
      </div>

      <div>
        <label class="block text-sm text-gray-600 mb-1">Email</label>
        <input type="email" name="email" required
          class="text-blue-500 w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
      </div>

      <div>
        <label class="block text-sm text-gray-600 mb-1">Password</label>
        <input type="password" name="password" required
          class="text-blue-500 w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
      </div>

      <button type="submit"
        class="w-full py-2 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition">
        Sign Up
      </button>
    </form>

  </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = e.target.email.value;
  const password = e.target.password.value;
  const errorBox = document.getElementById("loginError");

  errorBox.classList.add("hidden");

  try {
    const res = await fetch("http://localhost:8080/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ email, password }),
      credentials: "include",
    });

    const data = await res.json();

    if (res.status !==200) {
      errorBox.innerText = data.error || "Invalid Email or Password";
      errorBox.classList.remove("hidden");
      return;
    }

    localStorage.setItem("accessToken", data.accessToken);
    updateUI()
    document.getElementById("authContainer").classList.add("hidden");
    run();

  } catch (err) {
    errorBox.innerText = "Something went wrong";
    errorBox.classList.remove("hidden");
  }
}); 
</script>

<script>
  const loginForm = document.getElementById("loginForm");
  const signupForm = document.getElementById("signupForm");
  const loginTab = document.getElementById("loginTab");
  const signupTab = document.getElementById("signupTab");

  function showLogin() {
    loginForm.classList.remove("hidden");
    signupForm.classList.add("hidden");

    loginTab.className =
      "px-4 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";

    signupTab.className =
      "px-4 py-2 font-semibold text-gray-500 hover:text-indigo-600 transition";
  }

  function showSignup() {
    signupForm.classList.remove("hidden");
    loginForm.classList.add("hidden");

    signupTab.className =
      "px-4 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";

    loginTab.className =
      "px-4 py-2 font-semibold text-gray-500 hover:text-indigo-600 transition";
  }
</script>

<!-- UI of the page -->
    <div
      class="max-w-7xl w-full bg-slate-800/80 backdrop-blur-xl rounded-3xl shadow-2xl p-10 border border-slate-700/50"
    >
     <button
     id="logoutBtn"
    onclick="logout()"
    class="hidden absolute top-6 right-6 px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg font-semibold transition"
  >
    Logout
  </button>
      <div class="text-center mb-10">
        <h1
          class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-4 tracking-tight"
        >
          ChaiCode Cinema - Now Showing<br />
          <br />
          <span class="text-red-400">
            <span class="font-bold">Dhurandhar The Revenge</span>
          </span>
        </h1>
        <p class="text-slate-400 text-lg">Jassi ko ghar ki yaad kyu nhi aai?</p>
      </div>

      <div class="flex justify-center mb-10">
        <div
          class="bg-slate-900/50 rounded-full px-6 py-3 border border-slate-700 flex gap-8 items-center"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-4 h-4 rounded-full bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.6)]"
            ></div>
            <span class="text-slate-300 font-medium tracking-wide"
              >Available</span
            >
          </div>
          <div class="w-px h-6 bg-slate-700"></div>
          <div class="flex items-center gap-3">
            <div
              class="w-4 h-4 rounded-full bg-rose-500/20 border border-rose-500/50"
            ></div>
            <span class="text-slate-400 font-medium tracking-wide">Booked</span>
          </div>
        </div>
      </div>

      <div class="flex justify-center">
        <div
          class="bg-slate-900/40 p-8 rounded-2xl border border-slate-700/50 shadow-inner"
        >
          <table
            id="tbl"
            class="border-separate border-spacing-4 mx-auto"
          ></table>
        </div>
      </div>
    </div>

<script>

  function updateUI() {
  const token = localStorage.getItem("accessToken");
  const authModal = document.getElementById("authContainer"); // Use ID instead of .fixed
  const logoutBtn = document.getElementById("logoutBtn");
  
  if (token) {
    if (authModal) authModal.classList.add("hidden"); 
    if (logoutBtn) logoutBtn.classList.remove("hidden");
  } else {
    if (authModal) authModal.classList.remove("hidden"); 
    if (logoutBtn) logoutBtn.classList.add("hidden");
  }
}


window.addEventListener("load", updateUI);



      async function logout() {
  try {
  
    await fetch("/logout", {
      method: "POST",
      credentials: "include", 
    });

  
    localStorage.removeItem("accessToken");


    updateUI(); 

    document.getElementById("tbl").innerHTML = "";
    
    console.log("Logout successful");
  } catch (err) {
    console.error("Logout failed", err);
  }
}


  async function apiFetch(url, options = {}) {
  try {
    const accessToken = localStorage.getItem("accessToken");

    const res = await fetch(url, {
      ...options,
      headers: {
        ...options.headers,
        ...(accessToken && { Authorization: `Bearer ${accessToken}` }),
      },
      credentials: "include",
    });

  
    if (res.status === 401) {
      let data = {};
      try {
        data = await res.json();
      } catch { }

      if (data?.action === "login" || !data) {
        document.getElementById("authContainer").classList.remove("hidden");
      }
      if (data?.action === "signup" || !data) {
        document.getElementById("authContainer").classList.remove("hidden");
      }

      return null; 
    }

    const newToken = res.headers.get("x-access-token");
    if (newToken) {
      localStorage.setItem("accessToken", newToken);
    }

    return res;
  } catch (err) {
    console.error("API Error:", err);
    return null;
  }
}
      

  async function run() {
  const tbl = document.getElementById("tbl");

  tbl.innerHTML = "";

  const res = await apiFetch("/seats");

  if (!res) return;


  document.getElementById("authContainer").classList.add("hidden");

  const resarray = await res.json();
  const j = resarray.sort((a, b) => a.id - b.id);

  let tr;

  for (let i = 0; i < j.length; i++) {
    if (i % 8 === 0) tr = document.createElement("tr");

    const td = document.createElement("td");

    const baseClasses =
      "w-32 h-32 rounded-2xl text-center align-middle text-2xl font-bold transition-all duration-300 select-none relative group";

    if (j[i].isbooked) {
      td.className = `${baseClasses} bg-rose-500/10 text-rose-500/60 border border-rose-500/20 cursor-not-allowed`;

      td.innerHTML = `
        <span class="relative z-10">${j[i].id}</span>
        <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 px-4 py-2 bg-slate-900 border border-slate-700 text-sm text-slate-300 rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 whitespace-nowrap shadow-2xl z-50 pointer-events-none font-normal">
          Booked by: <span class="font-bold text-white ml-1">${j[i].name}</span>
        </div>
      `;
    } else {
      td.className = `${baseClasses} bg-emerald-500 text-white border-2 border-emerald-400 cursor-pointer`;

      td.innerHTML = `<span class="relative z-10">${j[i].id}</span>`;
    }

    td.addEventListener("click", async function (e) {
      if (td.classList.contains("cursor-not-allowed")) return;

      if (!localStorage.getItem("accessToken")) {
    alert("Please log in to book a seat.");
    document.getElementById("authContainer").classList.remove("hidden");
    return;
  }
      try {
        const id = j[i].id;
        const name = prompt("Enter your name");
        if (!name) return;

        const res = await apiFetch(`/${id}/${name}`, {
          method: "PUT",
        });

        if (!res) return;

        const data = await res.json(); // ✅ FIXED

        if (data.error) {
          alert("FAILED! Seat already booked.");
        } else {
          alert("Booked successfully!");

          td.className = `${baseClasses} bg-rose-500/10 text-rose-500/60 border border-rose-500/20 cursor-not-allowed`;

          td.innerHTML = `
            <span class="relative z-10">${id}</span>
            <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 px-4 py-2 bg-slate-900 border border-slate-700 text-sm text-slate-300 rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 whitespace-nowrap shadow-2xl z-50 pointer-events-none font-normal">
              Booked by: <span class="font-bold text-white ml-1">${name}</span>
            </div>
          `;
        }
      } catch (ex) {
        alert("Error booking: " + ex);
      }
    });

    tr.appendChild(td);
    tbl.appendChild(tr);
  }
}window.addEventListener("load", async () => {
  updateUI(); // Set up buttons and modals immediately
  await run(); // Fetch data from the server
}); 
    </script>
  </body>
</html>
