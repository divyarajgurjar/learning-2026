<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Location Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <style>
        #map { height: 90vh; }
     </style>
</head>
<body>
     <div id="map"></div>
    <h1>Hello</h1>

    <script src="/socket.io/socket.io.js"></script>
    <script>
    const socket = io();
        const remoteMarkers = new Map()

        socket.on('server:location:update', (data) =>{
            const {id, latitude, longitude} = data
            if(!remoteMarkers.has(id)){
               const marker =  L.marker([latitude, longitude])
               marker.addTo(map).bindPopup(id)
               remoteMarkers.set(id, marker)
            }else {
                const existingMarker = remoteMarkers.get(id);
                existingMarker.setLatLng([latitude, longitude])
            }
        })

    var map = L.map('map').setView([23.4733, 77.9479], 7); 

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

    function getUsersCurrentLocation() {
        return new Promise((res,rej) =>{
        if("geolocation" in navigator)
    {
        navigator.geolocation.getCurrentPosition(
            (position) => {console.log("Got user position", position)
                res({latitude: position.coords.latitude, longitude: position.coords.longitude})
            },
            (err) =>{
                rej(err)
            },
            {enableHighAccuracy: true}
        )
    }else {
        alert('Geolocation is not available in this browser.')
    }
        })
        
    }

    let myCurrentLocationMarker = null
    async function main() {

        setInterval(async () =>{
        const usersLocation = await getUsersCurrentLocation()
        
        socket.emit('client:location:update', {latitude: usersLocation.latitude,longitude: usersLocation.longitude})

        if(!myCurrentLocationMarker) {
            myCurrentLocationMarker = L.marker([usersLocation.latitude, usersLocation.longitude]).addTo(map).bindPopup('You are here');

        } else {
            myCurrentLocationMarker.setLatLng([usersLocation.latitude, usersLocation.longitude])
        }
        }, 10 * 1000)
        
    }
    window.addEventListener('load', main)
    </script>
</body>
</html>
